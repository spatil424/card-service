spring:
  application:
    name: cards-service
  datasource:
    url: jdbc:postgresql://postgresdb:5432/accountsdb
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  profiles:
    active: "prod"
  config:
    import: "configserver:http://configServer:8071"
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      readinessState:
        enabled: true
      livenessState:
        enabled: true
      probes:
        enabled: true

server:
  port: 9000

build:
  version: 3.0.0
cards:
  message: "Welcome to DemoBank cards related local APIs "
  contactDetails:
    name: "Dragos Lech - Developer"
    email: "dragos@demobank.com"
  onCallSupport:
